<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#beddf2"><meta name="description" content="Annastacia & Enrico — Wedding Invitation, 28 November 2026"><title>Annastacia & Enrico | Our Wedding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--blue:#c7e2f4;--gold:#bd934d;--ink:#17344c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Jost,Arial,sans-serif;background:#c7e2f4;color:var(--ink);overflow-x:hidden}button{font:inherit;cursor:pointer}.screen{min-height:100vh;min-height:100svh;position:relative;overflow:hidden}.opening{display:grid;place-items:center;padding:35px 16px;background:radial-gradient(ellipse at center,#fffdfa 0%,#d6eaf8 56%,#a6cbe7 100%)}.opening:before{content:"";position:absolute;inset:16px;border:1px solid #bb945e80;border-radius:260px 260px 8px 8px;pointer-events:none}.opening-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;width:100%}.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin:0}.envelope{position:relative;width:min(86vw,430px);aspect-ratio:1.45;cursor:pointer;perspective:850px;filter:drop-shadow(0 24px 20px #23445d36)}.envelope:focus-visible,.open-button:focus-visible{outline:3px solid #265a83;outline-offset:7px}.back{position:absolute;inset:0;background:#fffdf8;border:2px solid #b58d51;border-radius:7px}.letter{position:absolute;inset:10% 9% 7%;background:#fffefb;border:1px solid #c2a16c;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2;transition:transform 1s .3s;box-shadow:0 5px 12px #1232}.letter span{font:clamp(27px,6vw,39px) 'Great Vibes',cursive;color:#9d723b}.letter small{letter-spacing:.2em;font-size:10px}.front{position:absolute;inset:0;background:linear-gradient(150deg,#fdfbf5,#e9e1d6);clip-path:polygon(0 0,50% 53%,100% 0,100% 100%,0 100%);z-index:3;border-bottom:2px solid #b58d51}.front:after{content:"";position:absolute;inset:0;background:#f7f2e9;clip-path:polygon(0 100%,50% 44%,100% 100%)}.flap{position:absolute;inset:0;background:linear-gradient(#fffdf8,#e9e1d6);clip-path:polygon(0 0,50% 56%,100% 0);z-index:5;transform-origin:top;transition:transform .9s;backface-visibility:hidden}.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:75px;height:75px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#f7dfa7,#b98540 65%,#85561f);border:4px double #f8e3b6;color:#fff9e9;font:26px 'Cormorant Garamond',serif;box-shadow:0 5px 12px #533c2980;transition:opacity .2s}.opened .flap{transform:rotateX(180deg);z-index:1}.opened .seal{opacity:0}.opened .letter{transform:translateY(-45%)}.open-button{background:#fff8e8;border:1px solid #b58d51;border-radius:50px;color:var(--ink);padding:14px 28px;min-height:48px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.hint{font-size:12px;opacity:.75;margin:0}.hero{display:none;position:relative;isolation:isolate;background:#3e7097;min-height:100vh;min-height:100svh}.hero.revealed{display:flex;animation:fadein .7s ease-out both}@keyframes fadein{from{opacity:0}to{opacity:1}}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-1}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0c2b4a40,transparent 45%,#0c2b4a50);z-index:-1;pointer-events:none}.hero-inner{width:100%;max-width:1250px;margin:auto;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:clamp(28px,5vh,55px) 24px;text-align:center}.hero-title{font:normal clamp(42px,7vw,92px) 'Great Vibes',cursive;color:#fffdf5;text-shadow:0 3px 15px #102a46;line-height:1.12;margin:0}.hero-title span{color:#f2cf86}.hero-label{font-size:clamp(11px,1.3vw,15px);letter-spacing:.28em;color:#fff; text-shadow:0 2px 10px #17344c;margin:0}.hero-date{font:500 clamp(15px,2vw,21px) 'Cormorant Garamond',serif;letter-spacing:.12em;color:#fffdf7;text-shadow:0 2px 10px #17344c;margin:0}.hero-top{display:grid;gap:12px}.hero-bottom{display:grid;gap:12px}.hero-note{color:#fffdf7;font:italic clamp(20px,3vw,29px) 'Cormorant Garamond',serif;text-shadow:0 2px 10px #17344c;margin:0}.hero-bottom .hint{color:white;opacity:.9}@media(min-width:1200px){.hero-image{object-position:center 55%}}@media(min-width:700px) and (max-width:1199px){.hero-image{object-position:center}.hero-inner{padding:48px 30px}.hero-title{font-size:clamp(60px,8vw,88px)}}@media(max-width:699px){.opening:before{inset:10px;border-radius:160px 160px 8px 8px}.opening-inner{gap:18px}.eyebrow{font-size:10px;letter-spacing:.17em}.envelope{width:min(91vw,390px)}.seal{width:65px;height:65px;font-size:23px}.hero{min-height:100svh}.hero-image{object-fit:contain;object-position:center;background:#5b85a7}.hero:after{background:linear-gradient(180deg,#102b4d8c,#102b4d10 25%,#102b4d10 75%,#102b4d88)}.hero-inner{min-height:100svh;padding:24px 14px 30px}.hero-title{font-size:clamp(38px,9vw,58px)}.hero-label{font-size:10px;letter-spacing:.15em}.hero-note{font-size:20px}.hero-date{font-size:16px}.hero-top,.hero-bottom{gap:8px}}@media(max-width:360px){.hero-title{font-size:36px}.letter span{font-size:25px}.opening-inner{gap:13px}}@media(max-height:550px) and (orientation:landscape){.opening{min-height:600px}.envelope{width:min(50vw,330px)}.hero-inner{min-height:600px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main><section class="screen opening" id="opening"><div class="opening-inner"><p class="eyebrow">A special invitation awaits you</p><div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the wedding invitation"><div class="back"></div><div class="letter"><small>THE WEDDING OF</small><span>Annastacia & Enrico</span></div><div class="front"></div><div class="flap"></div><div class="seal">A&E</div></div><button id="open" class="open-button">Open our invitation</button><p class="hint">Tap the envelope to open</p></div></section><section class="screen hero" id="hero" aria-label="Annastacia and Enrico wedding hero"><img class="hero-image" src="/images/file_000000000598820ead592613f49b9804.png" alt="Baby-blue satin wedding artwork featuring golden wedding rings and flowers"><div class="hero-inner"><div class="hero-top"><p class="hero-label">THE WEDDING OF</p><h1 class="hero-title">Annastacia <span>&</span> Enrico</h1></div><div class="hero-bottom"><p class="hero-note">Two hearts, one beautiful beginning</p><p class="hero-date">28 NOVEMBER 2026</p></div></div></section></main><script>const envelope=document.getElementById('envelope'),openButton=document.getElementById('open'),hero=document.getElementById('hero');let isOpening=false;function openInvitation(){if(isOpening)return;isOpening=true;envelope.classList.add('opened');openButton.disabled=true;openButton.textContent='Opening…';setTimeout(()=>{hero.classList.add('revealed');hero.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});openButton.textContent='Invitation opened'},1000)}envelope.addEventListener('click',openInvitation);envelope.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openInvitation()}});openButton.addEventListener('click',openInvitation)</script></body></html>
